name: Build and test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build and run tests
        run: ./mvnw -B verify
      - name: Test summary
        if: always()
        run: |
          for f in target/surefire-reports/*.txt; do
            echo "::notice title=$(basename "$f" .txt)::$(grep 'Tests run' "$f")"
          done
