<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Error')}"></head>
<body th:class="${currentUser == null} ? 'plain'">
<th:block th:if="${currentUser != null}"><header th:replace="~{fragments :: nav}"></header></th:block>
<main id="main">
    <section class="card error-card">
        <p class="error-code" th:text="${status}">404</p>
        <h1 th:text="${status == 403} ? 'You do not have access to this' : (${status == 404} ? 'Page not found' : (${status == 400} ? 'That request was not valid' : 'Something went wrong'))">Error</h1>
        <p class="subtitle" th:if="${detail}" th:text="${detail}"></p>
        <p class="subtitle" th:unless="${detail}">
            <span th:if="${status == 403}">Your role is not allowed to do this. Ask an administrator if you need access.</span>
            <span th:if="${status == 404}">The page or record does not exist, or it was moved to the trash.</span>
            <span th:if="${status >= 500}">The problem was logged. Please try again in a moment.</span>
        </p>
        <div class="btn-row"><a class="btn" th:href="@{/}">Back to the dashboard</a></div>
    </section>
</main>
</body>
</html>
