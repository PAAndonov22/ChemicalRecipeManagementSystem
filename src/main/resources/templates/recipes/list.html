<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:attr="data-theme=${uiTheme}">
<head th:replace="~{fragments :: head('Recipes')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main id="main">
    <th:block th:with="canEdit=${can.contains('RECIPE_WRITE')}, canDelete=${can.contains('RECIPE_DELETE')}">
    <div class="page-head">
        <div>
            <h1>Recipes</h1>
            <p class="subtitle"><span th:text="${recipePage.totalElements}">0</span> chemical recipes.</p>
        </div>
        <div class="btn-row">
            <a class="btn light" th:href="${'/recipes/export?format=csv&' + qs}">CSV</a>
            <a class="btn light" th:href="${'/recipes/export?format=xlsx&' + qs}">Excel</a>
            <a class="btn light" th:if="${canEdit}" th:href="@{/recipes/import}"><svg class="icon" aria-hidden="true"><use href="#i-upload"/></svg>Import</a>
            <a class="btn light" th:if="${can.contains('TRASH_MANAGE')}" th:href="@{/recipes/trash}">Trash</a>
            <a class="btn" th:if="${canEdit}" th:href="@{/recipes/new}"><svg class="icon" aria-hidden="true"><use href="#i-plus"/></svg>New recipe</a>
        </div>
    </div>
    <div th:replace="~{fragments :: alerts}"></div>

    <div class="card">
        <form class="filters" th:action="@{/recipes}" method="get" role="search">
            <label class="grow">Name or code <input type="search" name="q" th:value="${search.q}" placeholder="e.g. spray, RX-1005"></label>
            <label>Category
                <select name="categoryId"><option value="">Any</option>
                    <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}" th:selected="${c.id == search.categoryId}"></option></select></label>
            <label>Signal word
                <select name="signalWord"><option value="">Any</option>
                    <option th:each="w : ${signalWords}" th:value="${w}" th:text="${w}" th:selected="${w == search.signalWord}"></option></select></label>
            <label>Status
                <select name="status"><option value="">Any</option>
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}" th:selected="${s == search.status}"></option></select></label>
            <label>Min price <input type="number" step="0.01" name="minPrice" th:value="${search.minPrice}"></label>
            <label>Max price <input type="number" step="0.01" name="maxPrice" th:value="${search.maxPrice}"></label>
            <label>Sort by
                <select name="sort"><option th:each="s : ${ {'name', 'code', 'price', 'status', 'createdAt'} }" th:value="${s}" th:text="${s}" th:selected="${s == sort}"></option></select></label>
            <label>Direction
                <select name="dir"><option value="asc" th:selected="${dir == 'asc'}">Ascending</option><option value="desc" th:selected="${dir == 'desc'}">Descending</option></select></label>
            <button class="btn" type="submit"><svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>Search</button>
            <a class="btn light" th:href="@{/recipes}">Clear</a>
        </form>
    </div>

    <div class="card table-wrap">
        <table>
            <thead>
            <tr>
                <th scope="col">Code</th><th scope="col">Name</th><th scope="col">Status</th><th scope="col">Categories</th>
                <th scope="col">Safety</th><th scope="col" class="num">Price / L</th>
                <th scope="col"><span class="visually-hidden">Actions</span></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="r : ${recipes}">
                <td class="muted" th:text="${r.code}"></td>
                <td><a class="cell-title" th:href="@{/recipes/{id}(id=${r.id})}" th:text="${r.name}"></a></td>
                <td><span class="badge dot" th:classappend="${r.status}" th:text="${r.status}"></span></td>
                <td><span class="tag" th:each="c : ${r.categories}" th:text="${c}"></span></td>
                <td class="wrap">
                    <th:block th:if="${r.safety != null}">
                        <span class="badge" th:classappend="${r.safety.signalWord}" th:text="${r.safety.signalWord}"></span>
                        <span class="cell-sub" th:text="${r.safety.hazardClass}"></span>
                    </th:block>
                </td>
                <td class="num" th:text="${#numbers.formatDecimal(r.price, 1, 2)} + ' €'"></td>
                <td class="actions">
                    <form th:if="${canDelete}" th:action="@{/recipes/{id}/delete(id=${r.id})}" method="post" style="display:inline"
                          onsubmit="return confirm('Move this recipe to the trash?')"><button class="btn light sm" type="submit">Delete</button></form>
                    <a class="btn light sm" th:if="${canEdit}" th:href="@{/recipes/{id}/edit(id=${r.id})}" th:attr="aria-label='Edit ' + ${r.name}">
                        <svg class="icon" aria-hidden="true"><use href="#i-edit"/></svg>Edit</a>
                </td>
            </tr>
            <tr th:if="${recipes.isEmpty()}"><td colspan="7" class="empty">No recipes match these filters.</td></tr>
            </tbody>
        </table>
        <th:block th:replace="~{fragments :: pager}"></th:block>
    </div>
    </th:block>
</main>
</body>
</html>
