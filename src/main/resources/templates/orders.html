<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Orders')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
    <h1>Orders</h1>
    <p class="subtitle">Filter and sort orders by week, date, day of the week and hour.</p>

    <div class="card">
        <form class="filters" th:action="@{/orders}" method="get">
            <label>Week <input type="week" name="week" th:value="${week}"></label>
            <label>Date <input type="date" name="date" th:value="${date}"></label>
            <label>Day
                <select name="day">
                    <option value="">Any day</option>
                    <option th:each="d : ${days}" th:value="${d}" th:text="${d}" th:selected="${d == day}"></option>
                </select>
            </label>
            <label>Hour
                <select name="hour">
                    <option value="">Any hour</option>
                    <option th:each="h : ${#numbers.sequence(0, 23)}" th:value="${h}" th:text="${h} + ':00'" th:selected="${h == hour}"></option>
                </select>
            </label>
            <label>Sort by
                <select name="sort">
                    <option th:each="s : ${ {'date', 'week', 'day', 'hour', 'total'} }" th:value="${s}" th:text="${s}" th:selected="${s == sort}"></option>
                </select>
            </label>
            <label>Direction
                <select name="dir">
                    <option value="desc" th:selected="${dir == 'desc'}">Descending</option>
                    <option value="asc" th:selected="${dir == 'asc'}">Ascending</option>
                </select>
            </label>
            <button class="btn">Apply</button>
            <a class="btn light" th:href="@{/orders}">Clear</a>
        </form>
    </div>

    <div class="grid">
        <div class="stat"><div class="label">Orders found</div><div class="value" th:text="${orders.size()}">0</div></div>
        <div class="stat teal"><div class="label">Total</div><div class="value" th:text="${#numbers.formatDecimal(total, 1, 2)} + ' €'">0</div></div>
    </div>

    <div class="card table-wrap">
        <table>
            <thead><tr><th>Date</th><th>Week</th><th>Day</th><th>Hour</th><th>Customer</th><th>Recipe</th><th class="num">Qty</th><th class="num">Total</th></tr></thead>
            <tbody>
            <tr th:each="o : ${orders}">
                <td th:text="${#temporals.format(o.orderedAt, 'dd.MM.yyyy')}"></td>
                <td th:text="${o.week}"></td>
                <td th:text="${o.orderedAt.dayOfWeek}"></td>
                <td th:text="${#temporals.format(o.orderedAt, 'HH:mm')}"></td>
                <td th:text="${o.customerName}"></td>
                <td th:text="${o.recipe.name}"></td>
                <td class="num" th:text="${o.quantity}"></td>
                <td class="num" th:text="${#numbers.formatDecimal(o.total, 1, 2)} + ' €'"></td>
            </tr>
            <tr th:if="${orders.isEmpty()}"><td colspan="8" class="muted">No orders match the filters.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
