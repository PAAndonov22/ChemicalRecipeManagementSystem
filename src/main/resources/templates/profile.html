<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:attr="data-theme=${uiTheme}">
<head th:replace="~{fragments :: head('My profile')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main id="main">
    <div class="page-head">
        <div>
            <h1>My profile</h1>
            <p class="subtitle">Update your name, email and phone.</p>
        </div>
    </div>
    <div th:replace="~{fragments :: alerts}"></div>
    <section class="card">
        <form th:action="@{/profile}" method="post" class="form-grid">
            <label>Full name <input name="fullName" th:value="${currentUser.fullName}" autocomplete="name" required></label>
            <label>Email <input type="email" name="email" th:value="${currentUser.email}" autocomplete="email" required></label>
            <label>Phone <input name="phone" th:value="${currentUser.phone}" autocomplete="tel"></label>
            <label>Role <input th:value="${currentUser.role}" disabled></label>
            <div class="full form-actions"><button class="btn" type="submit">Save changes</button></div>
        </form>
    </section>
</main>
</body>
</html>
