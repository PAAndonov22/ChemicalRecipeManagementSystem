<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:attr="data-theme=${uiTheme}">
<head th:replace="~{fragments :: head(${user == null} ? 'New user' : 'Edit user')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main id="main">
    <a class="back-link" th:href="@{/admin/users}"><svg class="icon" aria-hidden="true"><use href="#i-arrow-left"/></svg>Back to users</a>
    <div th:replace="~{fragments :: alerts}"></div>

    <!-- CREATE -->
    <section class="card" th:if="${user == null}">
        <h1>New user</h1>
        <p class="subtitle">Create an ADMIN, CHEMIST, TECHNICIAN, VET or RECEPTION account.</p>
        <form th:action="@{/admin/users}" method="post" class="form-grid">
            <label>Full name <input name="fullName" autocomplete="off" required></label>
            <label>Email <input type="email" name="email" autocomplete="off" required></label>
            <label>Phone <input name="phone" autocomplete="off"></label>
            <label>Password
                <input type="password" name="password" minlength="6" autocomplete="new-password" required>
                <span class="hint">At least 6 characters.</span>
            </label>
            <label>Role
                <select name="role">
                    <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                </select>
            </label>
            <div class="full form-actions">
                <button class="btn" type="submit">Create user</button>
                <a class="btn light" th:href="@{/admin/users}">Cancel</a>
            </div>
        </form>
    </section>

    <!-- EDIT -->
    <th:block th:if="${user != null}">
        <div class="page-head">
            <div>
                <h1 th:text="${user.fullName}">Name</h1>
                <p class="subtitle">
                    Registered <span th:text="${#temporals.format(user.createdAt, 'dd.MM.yyyy HH:mm')}"></span> &middot;
                    <span class="badge" th:classappend="${user.active} ? 'on' : 'off'" th:text="${user.active} ? 'Active' : 'Deactivated'"></span>
                </p>
            </div>
        </div>

        <section class="card">
            <h2>Profile</h2>
            <form th:action="@{/admin/users/{id}(id=${user.id})}" method="post" class="form-grid">
                <label>Full name <input name="fullName" th:value="${user.fullName}" required></label>
                <label>Email <input type="email" name="email" th:value="${user.email}" required></label>
                <label>Phone <input name="phone" th:value="${user.phone}"></label>
                <div class="full form-actions"><button class="btn" type="submit">Save profile</button></div>
            </form>
        </section>

        <div class="two-cols">
            <section class="card">
                <h2>Role</h2>
                <form th:action="@{/admin/users/{id}/role(id=${user.id})}" method="post" class="filters">
                    <label>Role
                        <select name="role">
                            <option th:each="r : ${roles}" th:value="${r}" th:text="${r}" th:selected="${r == user.role}"></option>
                        </select>
                    </label>
                    <button class="btn" type="submit">Change role</button>
                </form>
            </section>
            <section class="card">
                <h2>Account status</h2>
                <p class="muted">Deactivating is a soft delete: the user stays in the database but cannot log in.</p>
                <form th:action="@{/admin/users/{id}/active(id=${user.id})}" method="post"
                      onsubmit="return !this.dataset.confirm || confirm(this.dataset.confirm)"
                      th:attr="data-confirm=${user.active} ? 'Deactivate this user? They will not be able to log in.'">
                    <input type="hidden" name="active" th:value="${!user.active}">
                    <button class="btn" type="submit" th:classappend="${user.active} ? 'danger' : 'success'"
                            th:text="${user.active} ? 'Deactivate user' : 'Activate user'">Toggle</button>
                </form>
            </section>
        </div>
    </th:block>
</main>
</body>
</html>
