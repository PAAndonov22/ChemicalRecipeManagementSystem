<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:attr="data-theme=${uiTheme}">
<head th:replace="~{fragments :: head('New users')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main id="main">
    <div class="page-head">
        <div>
            <h1>New registrations</h1>
            <p class="subtitle">Users registered today and in the last week, month and year. Click a tile to see the list.</p>
        </div>
    </div>

    <div class="grid">
        <a class="stat" th:each="entry, i : ${counts}"
           th:href="@{/admin/users/registrations(period=${entry.key})}"
           th:attr="aria-current=${entry.key == period} ? 'true'"
           th:classappend="${(i.index == 1 ? 'teal' : i.index == 2 ? 'amber' : i.index == 3 ? 'green' : '') + (entry.key == period ? ' selected' : '')}">
            <div class="label" th:text="${entry.key == 'today' ? 'Today' : 'Last ' + entry.key}">period</div>
            <div class="value" th:text="${entry.value}">0</div>
        </a>
    </div>

    <section class="card">
        <h2>New users per month <span class="hint">(last 12 months)</span></h2>
        <div class="chart" role="img" aria-label="Bar chart of new users per month. The counts are shown above each bar.">
            <div class="bar-col" th:each="entry : ${perMonth}">
                <span class="bar-value" th:text="${entry.value}">0</span>
                <div class="bar" th:style="'height:' + ${entry.value * 80 / maxPerMonth} + '%'"></div>
            </div>
        </div>
        <div class="chart-labels" aria-hidden="true">
            <span th:each="entry : ${perMonth}" th:text="${#temporals.format(entry.key.atDay(1), 'MMM yy')}">Jan</span>
        </div>
    </section>

    <div class="card table-wrap">
        <h2>Registered <span th:text="${period == 'today' ? 'today' : 'in the last ' + period}"></span>
            (<span th:text="${newUsers.size()}">0</span>)</h2>
        <table>
            <thead><tr><th scope="col">Registered</th><th scope="col">Name</th><th scope="col">Email</th><th scope="col">Role</th><th scope="col">Status</th></tr></thead>
            <tbody>
            <tr th:each="u : ${newUsers}">
                <td th:text="${#temporals.format(u.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
                <td><a class="cell-title" th:href="@{/admin/users/{id}(id=${u.id})}" th:text="${u.fullName}"></a></td>
                <td th:text="${u.email}"></td>
                <td><span class="badge" th:classappend="${u.role}" th:text="${u.role}"></span></td>
                <td><span class="badge" th:classappend="${u.active} ? 'on' : 'off'" th:text="${u.active} ? 'Active' : 'Deactivated'"></span></td>
            </tr>
            <tr th:if="${newUsers.isEmpty()}"><td colspan="5" class="empty">Nobody registered in this period.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
