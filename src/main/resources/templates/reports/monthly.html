<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:attr="data-theme=${uiTheme}">
<head th:replace="~{fragments :: head('Monthly reports')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main id="main">
    <div class="page-head">
        <div>
            <h1>Reports</h1>
            <p class="subtitle">
                Pick a date in the calendar. The report covers whole months ending with that month
                (<b th:text="${#temporals.format(report.from(), 'dd.MM.yyyy')}"></b> &ndash;
                <b th:text="${#temporals.format(report.to(), 'dd.MM.yyyy')}"></b>).
            </p>
        </div>
        <nav class="tabs" aria-label="Report type">
            <a th:href="@{/reports}">Statistics</a>
            <a class="active" aria-current="page" th:href="@{/reports/monthly}">1 / 6 / 12 months</a>
        </nav>
    </div>

    <div class="two-cols">
        <section class="card">
            <h2>Period</h2>
            <nav class="tabs" aria-label="Number of months">
                <a th:each="m : ${monthOptions}" th:href="@{/reports/monthly(months=${m}, date=${selected})}"
                   th:classappend="${m == months} ? 'active'" th:attr="aria-current=${m == months} ? 'page'"
                   th:text="${m == 1 ? '1 month' : m + ' months'}">1 month</a>
            </nav>
            <div class="grid flush spaced">
                <div class="stat green"><div class="label">Total money</div><div class="value" th:text="${#numbers.formatDecimal(report.totalRevenue(), 1, 2)} + ' €'">0</div></div>
            </div>
            <div th:replace="~{fragments :: pdfButtons(${report})}"></div>
        </section>

        <!-- Calendar: a dot marks days with events, the selected day is filled -->
        <section class="card">
            <div class="calendar-head">
                <a class="btn light sm" th:if="${!prevMonth.isBefore(minDate.withDayOfMonth(1))}"
                   th:href="@{/reports/monthly(months=${months}, date=${prevMonth})}" aria-label="Previous month">
                    <svg class="icon" aria-hidden="true"><use href="#i-chevron-left"/></svg></a>
                <span th:unless="${!prevMonth.isBefore(minDate.withDayOfMonth(1))}"></span>
                <h2 th:text="${#temporals.format(calendarMonth.atDay(1), 'MMMM yyyy')}">Month</h2>
                <a class="btn light sm" th:if="${!nextMonth.isAfter(today)}"
                   th:href="@{/reports/monthly(months=${months}, date=${nextMonth})}" aria-label="Next month">
                    <svg class="icon" aria-hidden="true"><use href="#i-chevron-right"/></svg></a>
                <span th:unless="${!nextMonth.isAfter(today)}"></span>
            </div>
            <table class="calendar">
                <thead><tr><th scope="col">Mo</th><th scope="col">Tu</th><th scope="col">We</th><th scope="col">Th</th><th scope="col">Fr</th><th scope="col">Sa</th><th scope="col">Su</th></tr></thead>
                <tbody>
                <tr th:each="week : ${weeks}">
                    <td th:each="day : ${week}">
                        <th:block th:if="${day != null}">
                            <a th:if="${!day.isAfter(today) and !day.isBefore(minDate)}"
                               th:href="@{/reports/monthly(months=${months}, date=${day})}"
                               th:classappend="${(eventDays.contains(day) ? 'has-event ' : '') + (day == selected ? 'selected' : '')}"
                               th:attr="aria-current=${day == selected} ? 'date', title=${eventDays.contains(day)} ? 'Has events'"
                               th:text="${day.dayOfMonth}">1</a>
                            <span th:unless="${!day.isAfter(today) and !day.isBefore(minDate)}" class="disabled" th:text="${day.dayOfMonth}">1</span>
                        </th:block>
                    </td>
                </tr>
                </tbody>
            </table>
            <p class="legend"><span><i></i>Day with events</span></p>
        </section>
    </div>

    <div th:replace="~{fragments :: reportBody(${report})}"></div>
</main>
</body>
</html>
