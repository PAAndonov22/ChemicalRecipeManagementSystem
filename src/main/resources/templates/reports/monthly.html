<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Monthly reports')}"></head>
<body>
<header th:replace="~{fragments :: nav}"></header>
<main>
    <div class="page-head">
        <div>
            <h1>Reports &mdash; 1, 6 or 12 months</h1>
            <p class="subtitle">
                Pick a date in the calendar. The report covers whole months ending with that month
                (<b th:text="${#temporals.format(report.from(), 'dd.MM.yyyy')}"></b> &ndash;
                <b th:text="${#temporals.format(report.to(), 'dd.MM.yyyy')}"></b>).
            </p>
        </div>
        <div class="tabs">
            <a th:href="@{/reports}">Statistics</a>
            <a class="active" th:href="@{/reports/monthly}">1 / 6 / 12 months</a>
        </div>
    </div>

    <div class="two-cols">
        <div class="card">
            <h2>Period</h2>
            <div class="tabs">
                <a th:each="m : ${monthOptions}" th:href="@{/reports/monthly(months=${m}, date=${selected})}"
                   th:classappend="${m == months} ? 'active'" th:text="${m == 1 ? '1 month' : m + ' months'}">1 month</a>
            </div>
            <br>
            <div class="grid" style="margin-bottom: 0">
                <div class="stat green"><div class="label">Total money</div><div class="value" th:text="${#numbers.formatDecimal(report.totalRevenue(), 1, 2)} + ' €'">0</div></div>
            </div>
            <br>
            <div th:replace="~{fragments :: pdfButtons(${report})}"></div>
        </div>

        <!-- Calendar: green days have events, the selected day is blue -->
        <div class="card">
            <div class="calendar-head">
                <a class="btn light" th:if="${!prevMonth.isBefore(minDate.withDayOfMonth(1))}" th:href="@{/reports/monthly(months=${months}, date=${prevMonth})}">&larr;</a>
                <span th:unless="${!prevMonth.isBefore(minDate.withDayOfMonth(1))}"></span>
                <h2 style="margin: 0" th:text="${#temporals.format(calendarMonth.atDay(1), 'MMMM yyyy')}">Month</h2>
                <a class="btn light" th:if="${!nextMonth.isAfter(today)}" th:href="@{/reports/monthly(months=${months}, date=${nextMonth})}">&rarr;</a>
                <span th:unless="${!nextMonth.isAfter(today)}"></span>
            </div>
            <table class="calendar">
                <thead><tr><th>Mo</th><th>Tu</th><th>We</th><th>Th</th><th>Fr</th><th>Sa</th><th>Su</th></tr></thead>
                <tbody>
                <tr th:each="week : ${weeks}">
                    <td th:each="day : ${week}">
                        <th:block th:if="${day != null}">
                            <a th:if="${!day.isAfter(today) and !day.isBefore(minDate)}"
                               th:href="@{/reports/monthly(months=${months}, date=${day})}"
                               th:classappend="${(eventDays.contains(day) ? 'has-event ' : '') + (day == selected ? 'selected' : '')}"
                               th:text="${day.dayOfMonth}">1</a>
                            <span th:unless="${!day.isAfter(today) and !day.isBefore(minDate)}" class="disabled" th:text="${day.dayOfMonth}">1</span>
                        </th:block>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div th:replace="~{fragments :: reportBody(${report})}"></div>
</main>
</body>
</html>
