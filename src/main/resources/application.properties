spring.application.name=ChemicalRecipeSystem
server.port=8080

# H2 database stored in the data/ folder (delete data/ to reset the demo data)
spring.datasource.url=jdbc:h2:file:./data/crms
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# keep the session id in a cookie, not in the URL
server.servlet.session.tracking-modes=cookie
