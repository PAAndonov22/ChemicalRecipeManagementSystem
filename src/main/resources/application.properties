spring.application.name=ChemicalRecipeSystem
server.port=8080

# H2 database stored in the data/ folder (delete data/ to reset the demo data)
spring.datasource.url=jdbc:h2:file:./data/crms
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.thymeleaf.cache=false

# keep the session id in a cookie, not in the URL
server.servlet.session.tracking-modes=cookie

# uploads (task 5): 5 MB per file, stored outside the web root
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
crms.upload-dir=data/uploads

# never leak internals on error pages
server.error.include-stacktrace=never
server.error.include-message=never

# recipe workflow (task 9): allowed status transitions, configurable
crms.workflow.transitions.DRAFT=IN_REVIEW
crms.workflow.transitions.IN_REVIEW=APPROVED,REJECTED,DRAFT
crms.workflow.transitions.APPROVED=DRAFT
crms.workflow.transitions.REJECTED=DRAFT

# scheduled reminders (task 10): hourly, Sofia time; a review waiting longer than N days is reported
crms.reminders.cron=0 0 * * * *
crms.reminders.zone=Europe/Sofia
crms.reminders.review-days=3

# OpenAPI docs: /swagger-ui.html (log in first, the API uses the same session)
springdoc.swagger-ui.path=/swagger-ui.html
