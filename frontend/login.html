<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/assets/js/theme-init.js"></script>
    <title>Login | CRMS</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body class="auth-page">
    <div class="auth-page-stack">
        <img class="auth-page-logo" src="/assets/img/crms-logo.png" alt="CRMS logo">
        <div class="auth-card">
            <h1>Secure Recipe Access</h1>
            <p class="lede">Authenticate into the chemical recipe control environment and continue with tracked work.</p>
            <div id="status" class="status"></div>
            <form id="login-form" class="form-grid">
                <div class="field">
                    <label for="identifier">Email or Username</label>
                    <input id="identifier" required>
                </div>
            <div class="field">
                <label for="password">Password</label>
                <input id="password" type="password" required>
            </div>
            <label class="action-cluster" style="justify-content: flex-start;">
                <input id="rememberMe" type="checkbox">
                <span>Keep me signed in on this device</span>
            </label>
            <button class="button" type="submit">Sign In</button>
        </form>
            <div class="helper-link">Need an account? <a href="/register.html">Register here</a></div>
        </div>
    </div>
    <script type="module" src="/assets/js/pages/login.js"></script>
</body>
</html>
