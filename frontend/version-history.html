<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/assets/js/theme-init.js"></script>
    <title>Version History | CRMS</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
    <div class="app-shell">
        <aside id="sidebar" class="sidebar"></aside>
        <div class="content-shell">
            <header class="page-header">
                <div class="page-title">
                    <h1 id="page-title"></h1>
                    <p id="page-subtitle"></p>
                </div>
                <div id="user-chip" class="user-chip"></div>
            </header>
            <main class="page-grid">
                <section id="compare" class="card comparison-toolbar">
                    <div class="section-title">Version Comparison</div>
                    <div id="compare-status" class="status"></div>
                    <form id="compare-form" class="inline-form">
                        <div class="field">
                            <label for="leftVersion">Left Version</label>
                            <select id="leftVersion"></select>
                        </div>
                        <div class="field">
                            <label for="rightVersion">Right Version</label>
                            <select id="rightVersion"></select>
                        </div>
                        <button class="button" type="submit">Compare</button>
                    </form>
                    <div id="comparison-results"></div>
                </section>
                <section id="history" class="page-grid"></section>
            </main>
        </div>
    </div>
    <script type="module" src="/assets/js/pages/version-history.js"></script>
</body>
</html>
