<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/assets/js/theme-init.js"></script>
    <title>Recipes | CRMS</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
    <div class="app-shell">
        <aside id="sidebar" class="sidebar"></aside>
        <div class="content-shell">
            <header class="page-header">
                <div class="page-title">
                    <h1 id="page-title"></h1>
                    <p id="page-subtitle"></p>
                </div>
                <div id="user-chip" class="user-chip"></div>
            </header>
            <main class="page-grid">
                <section class="card">
                    <form id="filter-form" class="inline-form">
                        <div class="field">
                            <label for="search">Search</label>
                            <input id="search" placeholder="Code or recipe name">
                        </div>
                        <div class="field">
                            <label for="statusFilter">Status</label>
                            <select id="statusFilter">
                                <option value="">All</option>
                                <option value="draft">Draft</option>
                                <option value="approved">Approved</option>
                                <option value="archived">Archived</option>
                            </select>
                        </div>
                        <button class="button" type="submit">Apply Filters</button>
                    </form>
                </section>
                <section id="recipe-list" class="card"></section>
            </main>
        </div>
    </div>
    <script type="module" src="/assets/js/pages/recipes.js"></script>
</body>
</html>
