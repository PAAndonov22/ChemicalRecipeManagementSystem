<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/assets/js/theme-init.js"></script>
    <title>Settings | CRMS</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
    <div class="app-shell">
        <aside id="sidebar" class="sidebar"></aside>
        <div class="content-shell">
            <header class="page-header">
                <div class="page-title">
                    <h1 id="page-title"></h1>
                    <p id="page-subtitle"></p>
                </div>
                <div id="user-chip" class="user-chip"></div>
            </header>
            <main class="page-grid">
                <section class="card">
                    <div class="section-title" style="margin-bottom: 14px;">Profile</div>
                    <div id="profile-status" class="status"></div>
                    <form id="profile-form" class="form-grid">
                        <div class="field">
                            <label for="username">Username</label>
                            <input id="username" required>
                        </div>
                        <div class="field">
                            <label for="email">Email</label>
                            <input id="email" type="email" required>
                        </div>
                        <div class="button-row">
                            <button class="button" type="submit">Save Profile</button>
                        </div>
                    </form>
                </section>

                <section class="card">
                    <div class="section-title" style="margin-bottom: 14px;">Security</div>
                    <div id="password-status" class="status"></div>
                    <form id="password-form" class="form-grid">
                        <div class="field">
                            <label for="currentPassword">Current Password</label>
                            <input id="currentPassword" type="password" required>
                        </div>
                        <div class="field">
                            <label for="newPassword">New Password</label>
                            <input id="newPassword" type="password" required>
                        </div>
                        <div class="field">
                            <label for="confirmPassword">Confirm New Password</label>
                            <input id="confirmPassword" type="password" required>
                        </div>
                        <div class="button-row">
                            <button class="button" type="submit">Change Password</button>
                        </div>
                    </form>
                </section>

                <section class="card">
                    <div class="section-title" style="margin-bottom: 14px;">Preferences</div>
                    <div id="preferences-status" class="status"></div>
                    <form id="preferences-form" class="form-grid">
                        <div class="field">
                            <label for="theme">Theme</label>
                            <select id="theme">
                                <option value="light">Light</option>
                                <option value="dark">Dark</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="density">Density</label>
                            <select id="density">
                                <option value="comfortable">Comfortable</option>
                                <option value="compact">Compact</option>
                            </select>
                        </div>
                        <div class="field">
                            <label for="landingPage">Start Page</label>
                            <select id="landingPage"></select>
                        </div>
                        <div class="field">
                            <label for="defaultRecipeStatus">Default Recipe Filter</label>
                            <select id="defaultRecipeStatus">
                                <option value="">All</option>
                                <option value="approved">Approved</option>
                                <option value="draft">Draft</option>
                                <option value="archived">Archived</option>
                            </select>
                        </div>
                        <div class="button-row">
                            <button class="button" type="submit">Save Settings</button>
                        </div>
                    </form>
                </section>
            </main>
        </div>
    </div>
    <script type="module" src="/assets/js/pages/settings.js"></script>
</body>
</html>
