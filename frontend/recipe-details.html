<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Details | CRMS</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
    <div class="app-shell">
        <aside id="sidebar" class="sidebar"></aside>
        <div class="content-shell">
            <header class="page-header">
                <div class="page-title">
                    <h1 id="page-title"></h1>
                    <p id="page-subtitle"></p>
                </div>
                <div id="user-chip" class="user-chip"></div>
            </header>
            <main class="page-grid">
                <section id="actions" class="toolbar"></section>
                <section id="recipe-summary"></section>
                <section class="card">
                    <div class="section-title" style="margin-bottom: 12px;">Ingredients</div>
                    <div id="ingredients"></div>
                </section>
                <section class="card">
                    <div class="section-title" style="margin-bottom: 12px;">Sharing</div>
                    <div id="share-status" class="status"></div>
                    <form id="share-form" class="inline-form">
                        <div class="field">
                            <label for="shareEmail">User Email</label>
                            <input id="shareEmail" type="email">
                        </div>
                        <div class="field">
                            <label for="permissionLevel">Permission</label>
                            <select id="permissionLevel">
                                <option value="read">Read</option>
                                <option value="edit">Edit</option>
                            </select>
                        </div>
                        <button class="button" type="submit">Share Recipe</button>
                    </form>
                    <div id="shares" style="margin-top: 18px;"></div>
                </section>
            </main>
        </div>
    </div>
    <script type="module" src="/assets/js/pages/recipe-details.js"></script>
</body>
</html>
