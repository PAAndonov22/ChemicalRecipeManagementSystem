<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard | CRMS</title>
    <link rel="stylesheet" href="/assets/css/styles.css">
</head>
<body>
    <div class="app-shell">
        <aside id="sidebar" class="sidebar"></aside>
        <div class="content-shell">
            <header class="page-header">
                <div class="page-title">
                    <h1 id="page-title"></h1>
                    <p id="page-subtitle"></p>
                </div>
                <div id="user-chip" class="user-chip"></div>
            </header>
            <main class="page-grid">
                <section id="metrics" class="cards-grid"></section>
                <section>
                    <div class="section-title" style="margin-bottom: 12px;">Recent Activity</div>
                    <div id="recent-activity" class="list-cards"></div>
                </section>
                <section class="card">
                    <div class="section-title" style="margin-bottom: 12px;">Recipe Ownership</div>
                    <div id="owner-table"></div>
                </section>
            </main>
        </div>
    </div>
    <script type="module" src="/assets/js/pages/dashboard.js"></script>
</body>
</html>
